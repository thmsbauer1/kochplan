<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fbf6ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1611" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kochplan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<title>Kochplan</title>
<style>
:root{
  --bg:#fbf6ee;--card:#fff;--ink:#2b2219;--muted:#7a6b5b;--line:#eadfce;--soft:#f4ebdd;
  --tomato:#d4552f;--tomato-soft:#fbe3d9;--herb:#3d8b57;--herb-soft:#e0f0e4;
  --sea:#2c78a8;--sea-soft:#ddebf5;--corn:#b97d12;--corn-soft:#f8ead0;
  --tab:62px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1b1611;--card:#26201a;--ink:#f3ebe1;--muted:#b6a693;--line:#3b3229;--soft:#2f2821;
  --tomato:#ff8a63;--tomato-soft:#46271d;--herb:#7cc792;--herb-soft:#1f3527;
  --sea:#7fb8e0;--sea-soft:#1c2e3c;--corn:#e2b357;--corn-soft:#3b2f18;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 20px)}
h1,h2,h3{margin:0;line-height:1.2;font-family:"Baloo 2",Nunito,sans-serif;font-weight:700}
h1{font-size:1.5rem;font-weight:800}
h2{font-size:1.12rem}
h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.muted{color:var(--muted)}.small{font-size:.86rem}.tiny{font-size:.76rem}
.stack>*+*{margin-top:12px}
header.top{padding:calc(env(safe-area-inset-top) + 14px) 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.kicker{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.iconbtn{border:0;background:var(--soft);width:40px;height:40px;border-radius:12px;font-size:1.15rem;display:flex;align-items:center;justify-content:center}
.weekbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;margin:6px 0 12px}
.weekbar button{border:0;background:transparent;width:40px;height:36px;border-radius:10px;font-size:1.2rem}
.weekbar button:active{background:var(--soft)}
.weekbar .lbl{text-align:center}
.weekbar .lbl b{display:block;font-family:"Baloo 2";font-size:1.02rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card+.card{margin-top:10px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;background:var(--tomato);color:#fff;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:700;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:700;white-space:nowrap}
.pill.veg{background:var(--herb-soft);color:var(--herb)}
.pill.fisch{background:var(--sea-soft);color:var(--sea)}
.pill.gefluegel{background:var(--corn-soft);color:var(--corn)}
.pill.star{background:var(--corn-soft);color:var(--corn)}
.pill.box{background:var(--tomato-soft);color:var(--tomato)}
.pill.kc{background:var(--soft);color:var(--ink)}
.banner{background:var(--corn-soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:.88rem;display:flex;gap:10px;align-items:center}
.banner.err{background:var(--tomato-soft)}
.summary{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}

/* Woche */
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:9px}
.day.off{background:transparent;border-style:dashed}
.day .hd{display:flex;align-items:center;gap:10px}
.day .dn{width:42px;flex:none}
.day .dn b{display:block;font-family:"Baloo 2";font-size:1.05rem;line-height:1}
.day .dn span{font-size:.74rem;color:var(--muted)}
.day.today{box-shadow:0 0 0 2px var(--tomato)}
.cookt{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:800;color:var(--muted)}
.cookt.on{background:var(--herb-soft);border-color:transparent;color:var(--herb)}
.dish{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:transparent;padding:0;text-align:left}
.emo{width:44px;height:44px;flex:none;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.dish .nm{font-weight:800;font-size:.95rem;line-height:1.25}
.dish .mt{font-size:.76rem;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty{flex:1;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:12px;color:var(--muted);font-weight:700;text-align:left}
.dctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.mini{border:0;background:var(--soft);border-radius:9px;padding:5px 9px;font-size:.8rem;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.mini.on{background:var(--ink);color:var(--bg)}
.mini.star{background:var(--corn-soft);color:var(--corn)}
.stepper{display:inline-flex;align-items:center;background:var(--soft);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:transparent;width:28px;height:28px;font-weight:800}
.stepper span{font-size:.8rem;font-weight:700;padding:0 2px}
.share{font-size:.74rem;color:var(--herb);font-weight:700}

/* Listen */
.sec{margin-top:18px}
.sec>h2{margin:0 2px 8px;display:flex;align-items:center;gap:8px}
.item{display:flex;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.check{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;font-size:.95rem;color:#fff}
.check.on{background:var(--herb);border-color:var(--herb)}
.item.done .it{color:var(--muted);text-decoration:line-through}
.it{flex:1;min-width:0}
.it b{font-weight:800}
.it .tiny{display:block}
.q{font-weight:800;color:var(--tomato);white-space:nowrap}
.progress{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:8px 0 2px}
.progress i{display:block;height:100%;background:var(--herb);border-radius:4px;transition:width .3s}
.add{display:flex;gap:8px;margin-top:8px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;font-size:1rem}
textarea.inp{min-height:90px;resize:vertical;line-height:1.4}
label.f{display:block;font-size:.82rem;font-weight:800;margin:12px 0 5px}

/* Heute */
.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:center}
.hero .big{font-size:3.2rem;line-height:1}
.hero h2{font-size:1.35rem;margin-top:8px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
ol.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--tomato-soft);color:var(--tomato);font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
.zl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:.92rem}
.zl:first-child{border-top:0}
.rate{display:flex;gap:8px;justify-content:center;margin-top:10px}
.rate button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 18px;font-size:1.4rem}
.rate button.on{background:var(--herb-soft);border-color:var(--herb)}
.rate button.on.no{background:var(--tomato-soft);border-color:var(--tomato)}
.philip{background:linear-gradient(135deg,var(--corn-soft),var(--tomato-soft));border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.philip .ic{font-size:2rem}

/* Rezepte */
.rlist .r{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.rlist .r:first-child{border-top:0}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.68rem;font-weight:800;color:var(--muted);position:relative}
nav.tabs button i{font-style:normal;font-size:1.3rem;filter:grayscale(.7);opacity:.75}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on i{filter:none;opacity:1}
nav.tabs .badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--tomato);color:#fff;border-radius:999px;font-size:.62rem;padding:0 5px;line-height:1.5}

/* Sheet */
.shade{position:fixed;inset:0;background:rgba(20,14,8,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.shade.anim{animation:fd .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
.shade.anim .sheet{animation:up .2s}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .sh-search{flex-direction:column;align-items:stretch;gap:8px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;position:sticky;top:-8px;background:var(--bg);padding:6px 0;z-index:2}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.pick{display:flex;gap:10px;align-items:center;padding:10px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);width:100%;text-align:left;margin-bottom:8px}
.pick.cur{border-color:var(--tomato)}
.kidcards{display:grid;gap:10px}
.kid{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.kid .e{font-size:2.6rem}
.kid b{font-family:"Baloo 2";font-size:1.1rem;display:block;line-height:1.2}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:700;font-size:.9rem;z-index:60;max-width:90vw}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script src="familie-sync.js"></script>
<script src="rezepte.js"></script>
<script src="naehrwerte.js"></script>
<script>
"use strict";
/* ============================================================
   Kochplan – Essensplanung der Familie
   Daten: localStorage (sofort, offline) + Familienspeicher (Supabase: meal_weeks, meal_recipes, meal_ratings)
   Wochenplan-Abgleich: jeder Eintrag (Tag, Häkchen) trägt einen Zeitstempel t; beim Zusammenführen gewinnt je Eintrag der neuere.
   ============================================================ */
const FS=window.FamilieSync;
const BASE=3; /* Portionen der Grundrezepte */
const DAYS=["Mo","Di","Mi","Do","Fr","Sa","So"];
const DAYL=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const CATS={veg:["Vegetarisch","🥦"],fisch:["Fisch & Garnelen","🐟"],gefluegel:["Geflügel","🍗"]};
/* Reihenfolge wie bei einem Gang durch den REWE-Markt */
const DEPTS=[["obst","Obst & Gemüse","🥕"],["brot","Brot & Backwaren","🥖"],["kuehl","Kühlregal","🧀"],["fleisch","Fleisch & Fisch","🐟"],["trocken","Nudeln, Reis & Konserven","🥫"],["gewuerz","Gewürze & Soßen","🧂"],["tk","Tiefkühl","❄️"],["vorrat","Basics, die fehlen","🫙"],["sonst","Sonstiges","🛒"]];
const DEPTN=Object.fromEntries(DEPTS.map(d=>[d[0],d[1]]));
const COUNT_UNITS=["Stk","Dose","Bund","Pck","Becher","Glas","Kopf","Zehe","Scheiben"];
const UNITS="kg|g|ml|l|Stk|EL|TL|Bund|Dosen|Dose|Pck|Zehen|Zehe|Prise|Becher|Glas|Scheiben|Handvoll|Kopf";
const EMOJIS="🥗🍲🍛🍝🥘🍳🥙🌯🌮🍜🥢🍤🐟🍣🍗🥦🫑🍅🥕🥔🍠🎃🥑🫘🧆🍕🥞🍚";

/* ---------- kleine Helfer ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k,d){try{const t=localStorage.getItem(k);return t?JSON.parse(t):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const now=()=>Date.now();
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
const fromIso=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const addDays=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d);};
function kw(s){const d=fromIso(s);d.setDate(d.getDate()+3);const j=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-j)/864e5-3+((j.getDay()+6)%7))/7);}
const dshort=s=>{const d=fromIso(s);return d.getDate()+"."+(d.getMonth()+1)+".";};
const todayIdx=()=>(new Date().getDay()+6)%7;
const curWs=()=>iso(mondayOf(new Date()));
/* Ab Donnerstag wird die nächste Woche geplant */
const planWs=()=>todayIdx()>=3?addDays(curWs(),7):curWs();
const rnd=()=>Math.random();

/* ---------- Zutaten lesen ---------- */
function num(s){if(!s)return null;const m={"½":.5,"¼":.25,"¾":.75};if(m[s]!=null)return m[s];if(s.includes("/")){const[a,b]=s.split("/").map(Number);return b?a/b:null;}const v=parseFloat(s.replace(",","."));return isNaN(v)?null:v;}
const DEPT_RULES=[
  [/garnele|edamame|erbsen \(tk|\(tk/i,"tk"],
  [/lachs|kabeljau|seelachs|fisch|thunfisch frisch|hähnchen|haehnchen|pute|rind|hack|schwein|lamm|wurst|schinken|speck/i,"fleisch"],
  [/salz|pfeffer|öl\b|olivenöl|essig|balsamico|brühe|zucker|honig|senf|mehl|sojasauce|backpulver|currypulver|paprikapulver/i,"vorrat"],
  [/käse|feta|mozzarella|parmesan|halloumi|ricotta|quark|joghurt|milch|sahne|schmand|butter|\bei(er)?\b|tofu|frischkäse|gnocchi/i,"kuehl"],
  [/brot|toast|tortilla|wrap|baguette|ciabatta|brötchen|fladen/i,"brot"],
  [/nudel|pasta|spaghetti|reis|couscous|bulgur|quinoa|linsen|bohnen|kichererbsen|dose|mais|kokosmilch|tomaten gehackt|passierte|panko|nüsse|kerne|erdnuss/i,"trocken"],
  [/gewürz|kreuzkümmel|kurkuma|curry|chili|zimt|safran|paste/i,"gewuerz"]
];
let DEPT_DICT={};
function guessDept(n){const k=n.toLowerCase();if(DEPT_DICT[k])return DEPT_DICT[k];for(const[re,d]of DEPT_RULES)if(re.test(k))return d;return"obst";}
function parseZ(s){
  s=String(s).trim();let d=null;const m=s.match(/\s*@(\w+)\s*$/);if(m){d=m[1];s=s.slice(0,m.index).trim();}
  const r=s.match(new RegExp("^(?:([\\d.,/½¼¾]+)\\s*)?(?:("+UNITS+")\\.?\\s+)?(.+)$","i"));
  let q=r?num(r[1]):null,u=r&&r[2]?r[2]:null,n=r?r[3].trim():s;
  if(u){const U=u.toLowerCase();if(U==="kg"){u="g";q=q!=null?q*1000:q;}else if(U==="l"){u="ml";q=q!=null?q*1000:q;}else if(U==="zehen")u="Zehe";else if(U==="dosen")u="Dose";else u=UNITS.split("|").find(x=>x.toLowerCase()===U)||u;}
  if(q!=null&&!u)u="Stk";
  return{q,u,n,d:d||guessDept(n)};
}
function fmtNum(v){const w=Math.floor(v),f=v-w;const fr=Math.abs(f-.5)<.01?"½":"";if(fr)return(w?w:"")+fr;return String(Math.round(v*10)/10).replace(".",",");}
function fmtQ(q,u){
  if(q==null)return"";
  if(u==="g"||u==="ml"){const big=u==="g"?"kg":"l";if(q>=1000)return fmtNum(Math.round(q/100)/10)+" "+big;const r=q<100?Math.ceil(q/5)*5:Math.ceil(q/10)*10;return r+" "+u;}
  if(COUNT_UNITS.includes(u)){const v=q<1?Math.round(q*2)/2||.5:Math.ceil(q-.25);return fmtNum(v)+(u==="Stk"?"":" "+u);}
  if(u==="EL"||u==="TL")return fmtNum(Math.max(.5,Math.round(q*2)/2))+" "+u;
  return fmtNum(Math.round(q*10)/10)+" "+u;
}
const SPOON=new Set(["EL","TL","Prise","Handvoll"]);
const keyOf=n=>n.toLowerCase().replace(/\s*\(.*?\)\s*/g," ").replace(/\s+/g," ").trim();

/* ---------- Rezepte ---------- */
function norm(r,custom){
  const p=(r.p||[]).map(x=>Array.isArray(x)?{k:x[0],t:x[1],m:x[2]||10,h:x[3]||3}:x);
  return Object.assign({},r,{key:custom?"c:"+r.id:r.id,custom:!!custom,zz:(r.z||[]).map(parseZ),optz:r.opt&&r.opt.z?r.opt.z.map(parseZ):[],p,s:r.s||[],nw:r.nw||{}});
}
const STARTER=(window.REZEPTE||[]).map(r=>norm(r,false));
STARTER.forEach(r=>r.zz.forEach(z=>{DEPT_DICT[z.n.toLowerCase()]=z.d;}));
/* ---------- Kalorien (Einschätzung) ---------- */
const NW=window.NAEHRWERTE||{},NWR=window.NAEHRWERTE_REGELN||[];
const UNIT_G={Stk:100,Dose:240,Bund:30,Zehe:4,Scheiben:30,Pck:10,Becher:200,Glas:300,Kopf:500,Handvoll:30,Prise:.5};
function nwOf(z,own){const k=keyOf(z.n);if(NW[k])return NW[k];if(own&&own[k])return own[k];for(const[re,v]of NWR)if(re.test(z.n))return v;if(z.d==="obst")return{k:30,st:150};return null;}
function gramsOf(z,v){if(z.q==null)return 0;const u=z.u||"Stk";if(u==="g"||u==="ml")return z.q;if(u==="EL")return z.q*(v.el||12);if(u==="TL")return z.q*(v.el||12)/3;if(u==="Prise")return z.q*.5;if(u==="Handvoll")return z.q*30;return z.q*(v.st||UNIT_G[u]||100);}
function kcalOf(zz,own){let kc=0,g=0;const miss=[];for(const z of zz){const v=nwOf(z,own);if(!v){if(z.q!=null)miss.push(z.n);continue;}const gr=gramsOf(z,v);kc+=gr*v.k/100;g+=gr*(v.y||1);}return{kc,g,miss};}
/* je Portion (ein Drittel des Rezepts) und je 100 g fertiges Gericht */
function kcal(r){if(r._kc)return r._kc;const a=kcalOf(r.zz,r.nw),o=r.optz.length?kcalOf(r.optz,r.nw):null;
  r._kc={portion:Math.round(a.kc/BASE/10)*10,per100:a.g?Math.round(a.kc/a.g*100/5)*5:null,opt:o?Math.round(o.kc/2/10)*10:0,miss:a.miss};return r._kc;}
const showKcal=()=>!isKid();
const kcalPill=(r,long)=>{if(!showKcal())return"";const k=kcal(r);return long?`<span class="pill kc">≈ ${k.portion} kcal/Portion</span>${k.per100?`<span class="pill kc">≈ ${k.per100} kcal/100 g</span>`:""}`:`<span>≈ ${k.portion} kcal</span>`;};
const FRESH=new Set(["obst","kuehl","fleisch","brot"]);
const SKIP_SHARE=new Set(["zwiebel","knoblauch","rote zwiebel"]);
function freshSet(r){return new Set(r.zz.filter(z=>FRESH.has(z.d)&&!SKIP_SHARE.has(keyOf(z.n))).map(z=>keyOf(z.n)));}

function hasContent(w){if(!w)return false;for(const k of["days","buy","prep","extra","pantry"])for(const x of Object.values(w[k]||{}))if(x&&x.t)return true;return false;}
function blankWeek(){const days={};for(let d=0;d<7;d++)days[d]={cook:d<5,r:null,boxes:0,t:0};return{days,buy:{},prep:{},extra:{},pantry:{}};}
function week(ws){ws=ws||S.ws;if(!S.weeks[ws])S.weeks[ws]=blankWeek();const w=S.weeks[ws];for(const k of["days","buy","prep","extra","pantry"])w[k]=w[k]||{};for(let d=0;d<7;d++)if(!w.days[d])w.days[d]={cook:d<5,r:null,boxes:0,t:0};return w;}
function setDay(d,patch,ws){const w=week(ws);w.days[d]=Object.assign({},w.days[d],patch,{t:now()});saveWeek(ws);}
function setMark(map,key,val,ws){const w=week(ws);w[map][key]=Object.assign({},w[map][key]||{},typeof val==="object"?val:{v:val},{t:now()});saveWeek(ws);}

/* ---------- Speichern & Abgleich ---------- */
const dirty=new Set();let syncT=null;
function persist(){ls.set("kp-weeks",S.weeks);ls.set("kp-recipes",S.custom);ls.set("kp-ratings",S.ratings);ls.set("kp-members",S.members);}
function saveWeek(ws){ws=ws||S.ws;dirty.add(ws);persist();clearTimeout(syncT);syncT=setTimeout(()=>syncWeeks([...dirty]),1200);}
function mergeWeek(a,b){
  if(!a)return b;if(!b)return a;const out={};
  for(const k of["days","buy","prep","extra","pantry"]){const A=a[k]||{},B=b[k]||{},o={};
    for(const key of new Set(Object.keys(A).concat(Object.keys(B)))){const x=A[key],y=B[key];o[key]=!x?y:!y?x:((y.t||0)>(x.t||0)?y:x);}out[k]=o;}
  return out;
}
const fam=()=>FS.member().family_id;
async function syncWeeks(list){
  if(!online())return;
  for(const ws of list){
    try{
      const r=await FS.rest("/rest/v1/meal_weeks?select=data&family_id=eq."+fam()+"&week_start=eq."+ws);
      const remote=r&&r[0]?r[0].data:null,local=S.weeks[ws]||null;
      if(!remote&&!hasContent(local)){dirty.delete(ws);continue;}
      const merged=mergeWeek(local,remote);if(!merged)continue;
      const changedLocal=JSON.stringify(merged)!==JSON.stringify(local);
      if(JSON.stringify(merged)!==JSON.stringify(remote))
        await FS.rest("/rest/v1/meal_weeks?on_conflict=family_id,week_start",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:{family_id:fam(),week_start:ws,data:merged,updated_by:me().id}});
      S.weeks[ws]=merged;dirty.delete(ws);S.sync.err=null;S.sync.last=new Date();
      if(changedLocal){persist();if(!S.sheet&&!typingNow())render();}
    }catch(e){S.sync.err=netErr(e);}
  }
}
const netErr=e=>navigator.onLine===false||e instanceof TypeError?"Gerade kein Internet – wird später abgeglichen.":(e.message||"Fehler");
const typingNow=()=>{const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA");};

async function syncAll(){
  if(!online()||S.sync.busy)return;S.sync.busy=true;render();
  try{
    /* Mitglieder */
    try{S.members=await FS.familyMembers();}catch(e){}
    /* eigene Rezepte: erst ausstehende hochladen, dann alles holen */
    for(const c of S.custom.filter(c=>c._pending)){
      const body={data:c.data,archived:!!c.archived};
      if(String(c.id).startsWith("local-")){
        const r=await FS.rest("/rest/v1/meal_recipes",{method:"POST",headers:{Prefer:"return=representation"},body:Object.assign(body,{family_id:fam(),created_by:me().id})});
        const old=c.id;c.id=r[0].id;moveKey("c:"+old,"c:"+c.id);
      }else await FS.rest("/rest/v1/meal_recipes?id=eq."+c.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body});
      c._pending=false;
    }
    const rec=await FS.rest("/rest/v1/meal_recipes?select=id,data,archived,created_by,updated_at&order=created_at");
    S.custom=rec.map(x=>({id:x.id,data:x.data,archived:x.archived,created_by:x.created_by}));
    /* Bewertungen */
    for(const r of S.ratings.filter(r=>r._pending)){
      const mid=r.member_id==="local"?me().id:r.member_id;
      await FS.rest("/rest/v1/meal_ratings?on_conflict=member_id,recipe_key",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:{member_id:mid,family_id:fam(),recipe_key:r.recipe_key,rating:r.rating}});
    }
    S.ratings=await FS.rest("/rest/v1/meal_ratings?select=member_id,recipe_key,rating");
    /* Wochen: alle aus dem Speicher + lokale */
    const ws=await FS.rest("/rest/v1/meal_weeks?select=week_start,data&family_id=eq."+fam());
    for(const w of ws)S.weeks[w.week_start]=mergeWeek(S.weeks[w.week_start]||null,w.data);
    const pushList=Object.keys(S.weeks).filter(k=>hasContent(S.weeks[k])&&!ws.find(w=>w.week_start===k&&JSON.stringify(w.data)===JSON.stringify(S.weeks[k])));
    rebuild();persist();
    await syncWeeks(pushList);
    S.sync.err=null;S.sync.last=new Date();
  }catch(e){S.sync.err=netErr(e);}
  finally{S.sync.busy=false;rebuild();persist();if(!typingNow())render();}
}
function moveKey(a,b){for(const w of Object.values(S.weeks))for(const d of Object.values(w.days||{}))if(d.r===a)d.r=b;S.ratings.forEach(r=>{if(r.recipe_key===a)r.recipe_key=b;});}

/* ---------- Vorschläge ---------- */
function recentKeys(ws){const s=new Set();for(const off of[-7,-14]){const w=S.weeks[addDays(ws,off)];if(w)Object.values(w.days||{}).forEach(d=>{if(d.cook&&d.r)s.add(d.r);});}return s;}
function weekShared(w,skipDay){const m=new Map();for(let d=0;d<7;d++){if(d===skipDay)continue;const x=w.days[d];if(!x||!x.cook||!x.r||!BYKEY[x.r])continue;freshSet(BYKEY[x.r]).forEach(n=>m.set(n,(m.get(n)||0)+1));}return m;}
function sharedWith(r,shared){const out=[];freshSet(r).forEach(n=>{if(shared.has(n))out.push(n);});return out;}
const nice=n=>n.charAt(0).toUpperCase()+n.slice(1);
function catCount(w,skipDay){const c={veg:0,fisch:0,gefluegel:0};for(let d=0;d<7;d++){if(d===skipDay)continue;const x=w.days[d];if(x&&x.cook&&x.r&&BYKEY[x.r])c[BYKEY[x.r].c]=(c[BYKEY[x.r].c]||0)+1;}return c;}
/* Art des Gerichts – damit nicht zwei Currys oder drei Pastas in einer Woche landen */
const TYPES=[["tajine",/tajine/i],["wok",/wok/i],["curry",/curry|dal\b/i],["pasta",/pasta|spaghetti|nudeln|gnocchi/i],["bowl",/bowl/i],["salat",/salat/i],["suppe",/suppe|minestrone/i],["wrap",/wrap|taco/i],["ofen",/ofen|blech|päckchen/i],["ei",/frittata|shakshuka|puffer/i],["reis",/risotto|biryani|bibimbap|reis|paella/i]];
const typeOf=r=>{const t=TYPES.find(([,re])=>re.test(r.n));return t?t[0]:r.key;};
function fitScore(r,w,d,opts){
  opts=opts||{};const shared=weekShared(w,d),cnt=catCount(w,d);
  const n=Object.values(w.days).filter(x=>x.cook).length||1;
  const target={veg:Math.max(1,Math.round(n*.55)),fisch:Math.max(1,Math.round(n*.3)),gefluegel:n>=5?1:0};
  let s=Math.min(sharedWith(r,shared).length,4)*1.3;
  s+=(cnt[r.c]||0)<target[r.c]?2.5:-2.5*((cnt[r.c]||0)-target[r.c]+1);
  s+=scoreOf(r.key)*1.2;
  if(opts.recent&&opts.recent.has(r.key))s-=4;
  if(d<5&&(r.min>40||r.we))s-=6;
  if(w.days[d]&&w.days[d].boxes>0&&r.box)s+=1;
  if(r.custom)s+=.5;
  const kp=kcal(r).portion;if(kp>650)s-=1.5;else if(kp<=500)s+=.8;
  const ty=typeOf(r);for(let i=0;i<7;i++){if(i===d)continue;const x=w.days[i];if(x&&x.cook&&x.r&&BYKEY[x.r]&&typeOf(BYKEY[x.r])===ty)s-=3;}
  return s;
}
function pool(){return ALL.filter(r=>scoreOf(r.key)>-2);}
function suggestWeek(){
  const w=week(),recent=recentKeys(S.ws);let filled=0;
  for(let d=0;d<7;d++){
    const x=w.days[d];if(!x.cook||x.r)continue;
    const used=new Set(Object.values(w.days).map(y=>y.r).filter(Boolean));
    const cands=pool().filter(r=>!used.has(r.key)).map(r=>({r,s:fitScore(r,w,d,{recent})+rnd()*2.2})).sort((a,b)=>b.s-a.s);
    if(cands[0]){w.days[d]=Object.assign({},x,{r:cands[0].r.key,opt:false,t:now()});filled++;}
  }
  saveWeek();toast(filled?filled+" Gerichte vorgeschlagen – tauschen geht mit Tipp aufs Gericht":"Alle Kochtage haben schon ein Gericht");
}
function reshuffle(){const w=week();for(let d=0;d<7;d++){const x=w.days[d];if(x.cook&&x.r&&!x.lock&&!x.philip)w.days[d]=Object.assign({},x,{r:null,t:now()});}suggestWeek();}

/* ---------- Einkaufsliste ---------- */
function buildList(ws){
  const w=week(ws),items=new Map(),pantry=new Map();
  const add=(z,f,d)=>{
    if(z.d==="vorrat"){const k=keyOf(z.n);const p=pantry.get(k)||{key:"v:"+k,n:z.n,days:new Set()};p.days.add(d);pantry.set(k,p);return;}
    const k=keyOf(z.n)+"|"+(z.u||"");let it=items.get(k);
    if(!it){it={key:k,n:z.n,u:z.u,q:0,d:z.d,days:new Set(),noq:false};items.set(k,it);}
    if(z.q==null)it.noq=true;else it.q+=z.q*f;it.days.add(d);
  };
  for(let d=0;d<7;d++){const x=w.days[d];if(!x.cook||!x.r)continue;const r=BYKEY[x.r];if(!r)continue;
    const f=(BASE+(x.boxes||0))/BASE;r.zz.forEach(z=>add(z,f,d));if(x.opt)r.optz.forEach(z=>add(z,1,d));}
  const list=[...items.values()].map(it=>Object.assign(it,{qs:it.q&&!SPOON.has(it.u)?fmtQ(it.q,it.u):""}));
  for(const p of pantry.values()){const m=w.pantry[p.key];if(m&&m.v)list.push({key:p.key,n:p.n,u:null,q:0,qs:"",d:"vorrat",days:p.days});}
  for(const[id,x]of Object.entries(w.extra))if(x&&!x.del)list.push({key:"x:"+id,n:x.n,qs:"",d:"sonst",days:new Set(),extra:id});
  return{list,pantry:[...pantry.values()]};
}
function listText(ws){
  const{list}=buildList(ws),w=week(ws);let t="Einkauf KW "+kw(ws)+" ("+dshort(ws)+"–"+dshort(addDays(ws,6))+")\n";
  for(const[d,name]of DEPTS){const its=list.filter(i=>i.d===d&&!(w.buy[i.key]&&w.buy[i.key].v));if(!its.length)continue;t+="\n"+name+"\n"+its.map(i=>"• "+(i.qs?i.qs+" ":"")+i.n).join("\n")+"\n";}
  return t;
}

/* ---------- Sonntags-Prep ---------- */
function buildPrep(ws){
  const w=week(ws),g=new Map();
  for(let d=0;d<7;d++){const x=w.days[d];if(!x.cook||!x.r)continue;const r=BYKEY[x.r];if(!r)continue;
    r.p.forEach((p,i)=>{const k=(p.k||r.key+"#"+i)+"|"+p.t;let e=g.get(k);if(!e){e={key:"p:"+k,t:p.t,m:p.m,h:p.h,items:[]};g.set(k,e);}e.items.push({d,r});});}
  const sunday=[],later=[],eve=[];
  for(const e of g.values()){
    if(e.h<=1){e.items.forEach(it=>eve.push({key:e.key+"@"+it.d,t:e.t,d:it.d,r:it.r,on:it.d===0?"So":DAYS[it.d-1]}));continue;}
    const ok=e.items.filter(it=>it.d+1<=e.h),no=e.items.filter(it=>it.d+1>e.h);
    if(ok.length)sunday.push(Object.assign({},e,{items:ok,mm:Math.round(e.m*(1+.3*(ok.length-1)))}));
    no.forEach(it=>later.push({key:e.key+"@"+it.d,t:e.t,m:e.m,d:it.d,r:it.r,on:DAYS[Math.max(0,it.d-Math.min(e.h-1,2))]}));
  }
  sunday.sort((a,b)=>b.h-a.h||a.items[0].d-b.items[0].d);
  return{sunday,later,eve,total:sunday.reduce((a,e)=>a+e.mm,0)};
}

function weekLabel(ws){const c=curWs();const tag=ws===c?"Diese Woche":ws===addDays(c,7)?"Nächste Woche":ws===addDays(c,-7)?"Letzte Woche":"KW "+kw(ws);return`<b>${tag}</b><span class="tiny muted">KW ${kw(ws)} · ${dshort(ws)}–${dshort(addDays(ws,6))}</span>`;}

function vWoche(){
  const w=week(),c=catCount(w),boxes=Object.values(w.days).reduce((a,x)=>a+(x.cook&&x.r?(x.boxes||0):0),0);
  const cook=Object.values(w.days).filter(x=>x.cook).length,planned=Object.values(w.days).filter(x=>x.cook&&x.r).length;
  const shared=weekShared(w,-1),sharedN=[...shared.values()].filter(v=>v>1).length;
  const kid=isKid();
  const kcs=Object.values(w.days).filter(x=>x.cook&&x.r&&BYKEY[x.r]).map(x=>kcal(BYKEY[x.r]).portion);
  const avg=kcs.length?Math.round(kcs.reduce((a,b)=>a+b,0)/kcs.length/10)*10:0;
  let h=weekBar()+banner();
  h+=`<div class="summary">${avg&&showKcal()?`<span class="pill kc">Ø ≈ ${avg} kcal pro Abendessen</span>`:""}${Object.keys(CATS).map(k=>c[k]?`<span class="pill ${k}">${CATS[k][1]} ${c[k]}× ${CATS[k][0]}</span>`:"").join("")}${boxes?`<span class="pill box">🍱 ${boxes} ${boxes>1?"Boxen":"Box"}</span>`:""}${sharedN?`<span class="pill">🔗 ${sharedN} Zutaten doppelt genutzt</span>`:""}</div>`;
  h+=`<div class="row" style="margin-bottom:12px">${planned<cook?`<button class="btn grow" data-a="suggest">✨ ${planned?"Rest vorschlagen":"Woche vorschlagen"}</button>`:`<button class="btn sec grow" data-a="reshuffle">🔄 Neu mischen</button>`}<button class="btn ${kid?"":"sec"} grow" data-a="philip">⭐ ${kid?"Ich wähle!":"Philip wählt"}</button></div>`;
  const tIdx=S.ws===curWs()?todayIdx():-1;
  for(let d=0;d<7;d++){
    const x=w.days[d],r=x.r&&BYKEY[x.r],date=dshort(addDays(S.ws,d));
    h+=`<div class="day ${x.cook?"":"off"} ${d===tIdx?"today":""}"><div class="hd"><div class="dn"><b>${DAYS[d]}</b><span>${date}</span></div>`;
    if(!x.cook)h+=`<div class="grow small muted">Kein Kochen geplant</div><button class="cookt" data-a="cook" data-d="${d}">+ kochen</button></div></div>`;
    else{
      if(r){const sh=sharedWith(r,weekShared(w,d));
        h+=`<button class="dish" data-a="pick" data-d="${d}"><div class="emo">${r.e||"🍽️"}</div><div class="grow"><div class="nm">${esc(r.n)}</div><div class="mt">${catPill(r.c)}<span>⏱ ${r.min} Min</span>${kcalPill(r)}${x.philip?'<span class="pill star">⭐ Philips Wahl</span>':""}${x.lock?"<span>🔒</span>":""}</div>${sh.length?`<div class="share">🔗 teilt ${esc(sh.slice(0,3).map(nice).join(", "))}</div>`:""}</div></button>`;
      }else h+=`<button class="empty" data-a="pick" data-d="${d}">＋ Gericht wählen</button>`;
      h+=`</div><div class="dctl"><button class="mini on" data-a="cook" data-d="${d}" title="Kochtag an/aus">🍳 Kochen</button>`;
      if(r){
        h+=`<span class="stepper" title="Extra-Portionen für die Mittagsbox"><button data-a="box" data-d="${d}" data-n="-1">−</button><span>🍱 ${x.boxes||0}</span><button data-a="box" data-d="${d}" data-n="1">+</button></span>`;
        if(r.opt)h+=`<button class="mini ${x.opt?"on":""}" data-a="opt" data-d="${d}">${esc(r.opt.l)}</button>`;
        h+=`<button class="mini ${x.lock?"on":""}" data-a="lock" data-d="${d}" title="Beim Neu-Mischen behalten">🔒</button><button class="mini" data-a="open" data-k="${esc(r.key)}">Rezept</button><button class="mini" data-a="clear" data-d="${d}" title="Gericht entfernen">✕</button>`;
      }
      h+=`</div></div>`;
    }
  }

function vPrep(){

  const boxes=[];for(let d=0;d<7;d++){const x=w.days[d];if(x.cook&&x.r&&x.boxes&&BYKEY[x.r])boxes.push({d,n:x.boxes,r:BYKEY[x.r]});}

  h+=`<div class="card"><div class="row"><div class="grow"><h2>🔪 Sonntag, ${dshort(addDays(ws,-1))}</h2><p class="small muted">${P.sunday.length} Schritte · ca. ${P.total} Min</p></div><span class="pill">${doneN}/${P.sunday.length}</span></div><div class="progress"><i style="width:${P.sunday.length?Math.round(doneN/P.sunday.length*100):0}%"></i></div></div>`;
  if(P.sunday.length){h+=`<div class="sec"><div class="card" style="padding:4px 12px">`;
    for(const e of P.sunday){const on=w.prep[e.key]&&w.prep[e.key].v;const ds=e.items.map(it=>DAYS[it.d]).join(" + ");
      h+=`<div class="item ${on?"done":""}"><button class="check ${on?"on":""}" data-a="prep" data-k="${esc(e.key)}">${on?"✓":""}</button><div class="it"><b>${esc(e.t)}</b><span class="tiny muted">für ${ds}${e.items.length>1?" · doppelte Menge":""} · ${e.items.map(it=>esc(it.r.n)).filter((v,i,a)=>a.indexOf(v)===i).join(", ")} · hält ${e.h} Tage</span></div><span class="q">${e.mm}′</span></div>`;}
    h+=`</div></div>`;}
  if(boxes.length){h+=`<div class="sec"><h2>🍱 Mittagsboxen</h2><div class="card" style="padding:4px 12px">`;
    boxes.forEach(b=>{h+=`<div class="item"><div class="emo" style="width:36px;height:36px;font-size:1.2rem">${b.r.e}</div><div class="it"><b>${esc(b.r.n)}</b><span class="tiny muted">${DAYS[b.d]} abends ${b.n} Portion${b.n>1?"en":""} mehr kochen → Box für ${DAYS[(b.d+1)%7]} mittags</span></div></div>`;});
    h+=`</div></div>`;}
  if(P.later.length||P.eve.length){h+=`<div class="sec"><h2>📅 Unter der Woche</h2><div class="card" style="padding:4px 12px">`;
    for(const e of P.eve.concat(P.later)){const on=w.prep[e.key]&&w.prep[e.key].v;
      h+=`<div class="item ${on?"done":""}"><button class="check ${on?"on":""}" data-a="prep" data-k="${esc(e.key)}">${on?"✓":""}</button><div class="it"><b>${esc(e.t)}</b><span class="tiny muted">${e.on} abends · für ${DAYS[e.d]} (${esc(e.r.n)})</span></div></div>`;}
    h+=`</div><p class="tiny muted" style="margin:6px 4px">Hält nicht bis dahin oder muss frisch sein – deshalb kurz vorher.</p></div>`;}

    const F=s.foto||{};

      ${window.KP_PREVIEW?`<p class="small">📷 <b>Aus Fotos ausfüllen</b> – geht in der richtigen App, nicht in dieser Vorschau.</p>`
      :!online()?`<p class="small">📷 <b>Aus Fotos ausfüllen</b> – dafür bitte zuerst unter ⚙️ anmelden.</p>`
      :`<label class="btn ${F.busy?"sec":""} block" style="${F.busy?"pointer-events:none;opacity:.7":""}"><input type="file" id="fotoin" accept="image/*" multiple class="hide">${F.busy?"⏳ Lese "+F.n+" Foto"+(F.n>1?"s":"")+" …":"📷 Aus Fotos ausfüllen"}</label>
        <p class="tiny muted" style="margin-top:6px">${F.busy?"Das dauert etwa 20–40 Sekunden.":"Kochbuchseite, Zettel oder Bildschirmfoto – auch auf mehrere Fotos verteilt. Oder Zutaten auf dem Tisch, dann gibt es einen Vorschlag. Bis zu 4 Fotos."}</p>`}
      ${F.err?`<div class="banner err" style="margin-top:8px"><span>⚠️</span><span class="small">${esc(F.err)}</span></div>`:""}
      ${F.done?`<div class="banner" style="margin-top:8px"><span>✨</span><span class="small"><b>${F.art==="vorgeschlagen"?"Vorschlag aus euren Zutaten":"Rezept übernommen"}</b>${F.orig&&F.orig!==BASE?` – war für ${F.orig} Portionen, auf ${BASE} umgerechnet`:""}. Bitte kurz prüfen, dann speichern.${F.hinweis?"<br>"+esc(F.hinweis):""}</span></div>`:""}
    </div>`;
    b=`<div class="sh"><h2>${s.id?"Rezept bearbeiten":"Eigenes Rezept"}</h2><button class="iconbtn" data-a="close">✕</button></div>
    ${fotoBox}
    <form data-f="recipe">
      <label class="f">Name</label><input class="inp" name="n" required maxlength="80" value="${esc(v.n)}" placeholder="z. B. Omas Gemüsesuppe">
      <label class="f">Symbol</label><div class="chips" style="flex-wrap:wrap">${(Array.from(EMOJIS).includes(v.e)?Array.from(EMOJIS):[v.e].concat(Array.from(EMOJIS))).map(e=>`<button type="button" class="chip ${v.e===e?"on":""}" data-a="emo" data-k="${e}">${e}</button>`).join("")}</div>
      <div class="row"><div class="grow"><label class="f">Kategorie</label><select class="inp" name="c">${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${v.c===k?"selected":""}>${c[1]} ${c[0]}</option>`).join("")}</select></div><div style="width:110px"><label class="f">Minuten</label><input class="inp" name="min" type="number" min="5" max="240" value="${esc(v.min)}"></div></div>
      <div class="row" style="margin-top:10px"><label class="mini ${v.box?"on":""}"><input type="checkbox" name="box" ${v.box?"checked":""} class="hide">🍱 Box-tauglich</label><label class="mini ${v.k?"on":""}"><input type="checkbox" name="k" ${v.k?"checked":""} class="hide">⭐ Kinderliebling</label></div>
      <label class="f">Zutaten für ${BASE} Portionen – eine pro Zeile</label><textarea class="inp" name="z" rows="7" placeholder="200 g Feta&#10;2 Stk Zucchini&#10;1 Dose Kichererbsen&#10;Salz, Pfeffer">${esc(v.z)}</textarea>
      <p class="tiny muted" style="margin-top:4px">Menge, Einheit (g, ml, Stk, EL, TL, Bund, Dose …), Name. Die Abteilung im Laden wird erraten.</p>
      <label class="f">Zubereitung – ein Schritt pro Zeile</label><textarea class="inp" name="s" rows="5">${esc(v.s)}</textarea>
      <label class="f">Am Sonntag vorbereiten (optional, eine Sache pro Zeile)</label><textarea class="inp" name="p" rows="3" placeholder="Reis kochen und kühl stellen">${esc(v.p)}</textarea>
      <label class="f">Philips Job (optional)</label><input class="inp" name="ph" value="${esc(v.ph)}" placeholder="z. B. Gemüse waschen">
      <button class="btn block" style="margin-top:16px">Speichern</button>
    </form>`;
  }
  else if(s.type==="text"){
    b=`<div class="sh"><h2>Einkaufszettel als Text</h2><button class="iconbtn" data-a="close">✕</button></div><textarea class="inp" id="listtext" rows="16" readonly>${esc(s.t)}</textarea><button class="btn block" style="margin-top:10px" data-a="copytext">Kopieren</button>`;
  }
  else if(s.type==="settings"){
    const sess=FS&&FS.session(),m=FS&&FS.member();
    b=`<div class="sh"><h2>Einstellungen</h2><button class="iconbtn" data-a="close">✕</button></div>`;
    if(!sess){b+=`<div class="card"><h3>Familienspeicher</h3><p class="small muted" style="margin:6px 0 10px">Mit eurem Konto aus den anderen Apps anmelden. Dann sehen Thomas, Nadine und Philip denselben Plan und denselben Einkaufszettel – auch beim gemeinsamen Abhaken.</p>
      <form data-f="login" class="stack"><input class="inp" name="mail" type="email" autocomplete="username" placeholder="E-Mail" value="${esc(S.ui.mail||"")}" required><input class="inp" name="pw" type="password" autocomplete="current-password" placeholder="Passwort" required><button class="btn block" ${S.ui.busy?"disabled":""}>${S.ui.busy?"Melde an …":"Anmelden"}</button></form>${S.ui.err?`<p class="small" style="color:var(--tomato);margin-top:8px">${esc(S.ui.err)}</p>`:""}</div>`;}
    else{const t=S.sync.last?S.sync.last.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):null;
      b+=`<div class="card"><h3>Familienspeicher</h3><p class="small" style="margin-top:6px">Angemeldet als <b>${esc(m?m.display_name:sess.email)}</b></p><p class="small muted">${S.sync.err?esc(S.sync.err):S.sync.busy?"Gleiche ab …":t?"Zuletzt abgeglichen um "+t+" Uhr":""}</p><div class="row" style="margin-top:10px"><button class="btn sm sec" data-a="syncnow">Jetzt abgleichen</button><button class="btn sm ghost" data-a="logout">Abmelden</button></div></div>`;}
    b+=`<div class="card"><h3>So funktioniert's</h3><p class="small" style="margin-top:6px">📅 <b>Donnerstag/Freitag:</b> Woche planen – Kochtage an- und abwählen, „Woche vorschlagen“, einzelne Tage tauschen. Philip wählt ein Gericht.<br>🛒 <b>Samstag:</b> Einkaufen mit der Liste, gemeinsam abhaken.<br>🔪 <b>Sonntag:</b> Vorbereiten nach Plan.<br>🍽️ <b>Abends:</b> „Heute“ zeigt Rezept, Philips Job und die Bewertung.</p></div>`;
  }
  const anim=s!==lastSheet;lastSheet=s;
  return`<div class="shade${anim?" anim":""}" data-a="shade"><div class="sheet" role="dialog"><div class="grab"></div>${b}</div></div>`;
}

/* ---------- Rendern ---------- */
function render(){
  const tabs=[["woche","📅","Woche"],["einkauf","🛒","Einkauf"],["prep","🔪","Vorbereiten"],["heute","🍽️","Heute"],["rezepte","📖","Rezepte"]];
  const {list}=buildList(S.ws),w=week(S.ws),open=list.filter(i=>!(w.buy[i.key]&&w.buy[i.key].v)).length;
  let body=S.tab==="einkauf"?vEinkauf():S.tab==="prep"?vPrep():S.tab==="heute"?vHeute():S.tab==="rezepte"?vRezepte():vWoche();
  const head=S.tab==="rezepte"?"":`<header class="top"><div><p class="kicker">Kochplan${online()?" · "+esc(me().display_name):""}</p><h1>${S.tab==="woche"?"Unsere Woche":S.tab==="einkauf"?"Einkaufszettel":S.tab==="prep"?"Vorbereiten":"Heute"}</h1></div><button class="iconbtn" data-a="settings" aria-label="Einstellungen">${S.sync.busy?"⏳":"⚙️"}</button></header>`;
  const sc=window.scrollY,qFocus=document.activeElement&&document.activeElement.id==="q";
  document.getElementById("app").innerHTML=`<main class="wrap">${S.tab==="rezepte"?`<header class="top" style="padding-bottom:0"><p class="kicker">Kochplan</p><button class="iconbtn" data-a="settings">⚙️</button></header>`:""}${head}${body}</main>
   <nav class="tabs"><div class="in">${tabs.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-a="tab" data-t="${t[0]}"><i>${t[1]}</i>${t[2]}${t[0]==="einkauf"&&open?`<span class="badge">${open}</span>`:""}</button>`).join("")}</div></nav>
   ${sheetHTML()}${S.toast?`<div class="toast">${esc(S.toast)}</div>`:""}`;
  if(qFocus){const q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}}
  if(S.top){window.scrollTo(0,0);S.top=false;}else window.scrollTo(0,sc);
  document.body.style.overflow=S.sheet?"hidden":"";
}
let toastT=null;function toast(t){S.toast=t;clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;const el=document.querySelector(".toast");if(el)el.remove();},2600);}
function keepSheetScroll(fn){const sh=document.querySelector(".sheet"),st=sh?sh.scrollTop:0;fn();const n=document.querySelector(".sheet");if(n)n.scrollTop=st;}

/* ---------- Rezept-Formular ---------- */
function editState(r){
  if(!r)return{n:"",e:"🍲",c:"veg",min:30,box:false,k:false,z:"",s:"",p:"",ph:"",zd:{},nw:{},pm:{}};
  const zLine=z=>(z.q!=null?fmtNum(z.q)+" "+(z.u||"Stk")+" ":"")+z.n;
  return{n:r.n,e:r.e||"🍲",c:r.c,min:r.min,box:!!r.box,k:!!r.k,z:r.zz.map(zLine).join("\n"),s:r.s.join("\n"),p:r.p.map(p=>p.t).join("\n"),ph:r.ph||"",
    zd:Object.fromEntries(r.zz.map(z=>[keyOf(z.n),z.d])),nw:Object.assign({},r.nw||{}),pm:Object.fromEntries(r.p.map(p=>[p.t,[p.m,p.h]]))};
}
function readForm(f){
  const g=n=>(f.elements[n]&&f.elements[n].value||"").trim();
  const lines=t=>t.split("\n").map(x=>x.trim()).filter(Boolean);
  const v=S.sheet.v,zd=v.zd||{},pm=v.pm||{},nw={};
  const z=lines(g("z")).map(l=>{l=l.replace(/\s*@\w+\s*$/,"");const p=parseZ(l),k=keyOf(p.n);if(v.nw&&v.nw[k])nw[k]=v.nw[k];return l+" @"+(zd[k]||p.d);});
  return{n:g("n"),e:v.e,c:g("c"),min:Math.max(5,Math.min(240,parseInt(g("min"))||30)),box:f.elements.box.checked,k:f.elements.k.checked,
    z,s:lines(g("s")),p:lines(g("p")).map(t=>[null,t,(pm[t]||[])[0]||15,(pm[t]||[])[1]||3]),ph:g("ph"),nw};
}
async function saveRecipe(data,id){
  let c=id?S.custom.find(x=>x.id===id):null;
  if(c){c.data=data;c._pending=true;}else{c={id:"local-"+now().toString(36),data,archived:false,_pending:true,created_by:me().id};S.custom.push(c);}
  rebuild();persist();
  if(online()){try{
    if(String(c.id).startsWith("local-")){const r=await FS.rest("/rest/v1/meal_recipes",{method:"POST",headers:{Prefer:"return=representation"},body:{family_id:fam(),created_by:me().id,data,archived:false}});const old=c.id;c.id=r[0].id;moveKey("c:"+old,"c:"+c.id);}
    else await FS.rest("/rest/v1/meal_recipes?id=eq."+c.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:{data}});
    c._pending=false;rebuild();persist();
  }catch(e){toast("Gespeichert – wird hochgeladen, sobald Internet da ist");}}
  return c;
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,d=b.dataset.d!=null?+b.dataset.d:null,k=b.dataset.k;
  if(a==="shade"&&e.target!==b)return;
  switch(a){
    case"tab":S.top=true;S.tab=b.dataset.t;S.sheet=null;ls.set("kp-tab",S.tab);if(S.tab==="heute"||S.tab==="einkauf")lastPoll=0;render();break;
    case"wk":S.ws=addDays(S.ws,+b.dataset.n);render();break;
    case"gotoweek":S.top=true;S.ws=b.dataset.ws;S.tab="woche";render();break;
    case"settings":S.sheet={type:"settings"};render();break;
    case"close":case"shade":S.sheet=null;render();break;
    case"cook":{const x=week().days[d];setDay(d,{cook:!x.cook});render();break;}
    case"pick":S.sheet={type:"pick",d};render();break;
    case"pickf":S.sheet.f=k;keepSheetScroll(render);break;
    case"choose":setDay(S.sheet.d,{r:k,opt:false,philip:false});S.sheet=null;render();break;
    case"clear":setDay(d,{r:null,lock:false,philip:false,opt:false,boxes:0});render();break;
    case"lock":setDay(d,{lock:!week().days[d].lock});render();break;
    case"opt":setDay(d,{opt:!week().days[d].opt});render();break;
    case"box":{const x=week().days[d];setDay(d,{boxes:Math.max(0,Math.min(3,(x.boxes||0)+ +b.dataset.n))});render();break;}
    case"suggest":suggestWeek();render();break;
    case"reshuffle":reshuffle();render();break;
    case"philip":S.sheet={type:"philip"};render();break;
    case"pday":S.sheet={type:"philip",d};render();break;
    case"preroll":S.sheet.opts=null;keepSheetScroll(render);break;
    case"pchoose":{const pd=S.sheet.d;setDay(pd,{r:k,philip:true,lock:true,opt:false});S.sheet=null;toast("⭐ Super Wahl! Das gibt's am "+DAYL[pd]);render();break;}
    case"open":S.sheet={type:"recipe",k};render();break;
    case"plan":{const w=week(),dd=d;if(w.days[dd].r===k)setDay(dd,{r:null});else setDay(dd,{r:k,cook:true,opt:false});keepSheetScroll(render);break;}
    case"rate":keepSheetScroll(()=>{rate(k,+b.dataset.n);});break;
    case"buy":{const w=week();setMark("buy",k,!(w.buy[k]&&w.buy[k].v));render();break;}
    case"prep":{const ws=b.dataset.ws||S.ws,w=week(ws);setMark("prep",k,!(w.prep[k]&&w.prep[k].v),ws);render();break;}
    case"pantry":{const w=week();setMark("pantry",k,!(w.pantry[k]&&w.pantry[k].v));render();break;}
    case"delextra":{const w=week();w.extra[b.dataset.id]=Object.assign({},w.extra[b.dataset.id],{del:true,t:now()});saveWeek();render();break;}
    case"hidedone":S.hideDone=!S.hideDone;render();break;
    case"helped":{const ws=curWs();setDay(d,{helped:!week(ws).days[d].helped},ws);render();if(week(ws).days[d].helped)toast("🧑‍🍳 Kochmütze verdient!");break;}
    case"share":shareList();break;
    case"copytext":{const ta=document.getElementById("listtext");if(ta){ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>toast("Liste kopiert"),()=>{});}catch(err){}}break;}
    case"filter":S.filter=k;render();break;
    case"newrecipe":S.sheet={type:"edit",v:editState(null)};render();break;
    case"fotorecipe":S.sheet={type:"edit",v:editState(null)};render();{const fi=document.getElementById("fotoin");if(fi)fi.click();}break;
    case"editrecipe":{const r=BYKEY[k];S.sheet={type:"edit",id:r.id,v:editState(r)};render();break;}
    case"copyrecipe":{const r=BYKEY[k];const v=editState(r);v.n=r.n+" (unsere Variante)";S.sheet={type:"edit",v};render();break;}
    case"archiverecipe":{if(!confirmInline(b))break;const r=BYKEY[k];const c=S.custom.find(x=>x.id===r.id);if(c){c.archived=true;c._pending=true;rebuild();persist();
        if(online())FS.rest("/rest/v1/meal_recipes?id=eq."+c.id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:{archived:true}}).then(()=>{c._pending=false;persist();}).catch(()=>{});}
      S.sheet=null;render();toast("Rezept gelöscht");break;}
    case"emo":{const f=document.querySelector("form[data-f=recipe]");const cur=readFormSafe(f);S.sheet.v=Object.assign(S.sheet.v,cur,{e:k});keepSheetScroll(render);break;}
    case"syncnow":syncAll();break;
    case"logout":FS.signOut().then(()=>{S.sync={busy:false,err:null,last:null};render();});break;
  }
});
async function shareList(){
  const t=listText(S.ws);
  if(navigator.share){try{await navigator.share({title:"Einkaufszettel",text:t});return;}catch(e){if(e&&e.name==="AbortError")return;}}
  try{await navigator.clipboard.writeText(t);toast("Liste kopiert – z. B. in Picnic oder WhatsApp einfügen");return;}catch(e){}
  S.sheet={type:"text",t};render();
}
/* ---------- Rezept aus Fotos (Edge Function rezept-foto) ---------- */
function bildVerkleinern(file){
  return new Promise((ok,fail)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{try{const M=1568,sc=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      ok({typ:"image/jpeg",daten:c.toDataURL("image/jpeg",.85).split(",")[1]});}catch(err){fail(err);}};
    img.onerror=()=>{URL.revokeObjectURL(url);fail(new Error("Dieses Bildformat kann der Browser nicht öffnen."));};
    img.src=url;
  });
}
async function fotoLesen(files){
  if(!S.sheet||S.sheet.type!=="edit"||!files.length)return;
  files=files.filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|heic|heif|webp)$/i.test(f.name)).slice(0,4);
  if(!files.length){S.sheet.foto={err:"Bitte Fotos auswählen."};render();return;}
  const sh=S.sheet;sh.foto={busy:true,n:files.length};render();
  try{
    const bilder=[];for(const f of files)bilder.push(await bildVerkleinern(f));
    const bekannt=[...new Set(ALL.flatMap(r=>r.zz.map(z=>z.n)))].sort();
    const res=await FS.fn("rezept-foto",{bilder,bekannt});
    if(S.sheet!==sh)return;
    if(!res||res.art==="unklar"||!res.rezept){sh.foto={err:(res&&res.hinweis)||"Auf den Fotos war kein Rezept zu erkennen."};render();return;}
    const r=res.rezept;
    sh.v={n:r.n,e:r.e||"🍲",c:r.c,min:r.min,box:!!r.box,k:!!r.k,z:r.z.join("\n"),s:r.s.join("\n"),p:r.p.map(x=>x[1]).join("\n"),ph:r.ph||"",
      zd:res.abt||{},nw:res.nw||{},pm:Object.fromEntries(r.p.map(x=>[x[1],[x[2],x[3]]]))};
    sh.foto={done:true,art:res.art,orig:res.portionen_original,hinweis:res.hinweis};
  }catch(err){if(S.sheet!==sh)return;sh.foto={err:netErr(err)};}
  render();const el=document.querySelector(".sheet");if(el)el.scrollTop=0;
}
/* Löschen erst nach zweitem Tipp (keine Browser-Dialoge) */
function confirmInline(b){if(b.dataset.sure)return true;b.dataset.sure="1";b.textContent="Wirklich löschen?";b.style.borderColor="var(--tomato)";b.style.color="var(--tomato)";return false;}
function readFormSafe(f){if(!f)return{};const g=n=>f.elements[n]?f.elements[n].value:"";return{n:g("n"),c:g("c"),min:g("min"),box:f.elements.box.checked,k:f.elements.k.checked,z:g("z"),s:g("s"),p:g("p"),ph:g("ph")};}
document.addEventListener("change",e=>{if(e.target.id==="fotoin"){fotoLesen([...e.target.files]);return;}});
document.addEventListener("change",e=>{const t=e.target;if(t.type==="checkbox"&&t.closest("label.mini"))t.closest("label.mini").classList.toggle("on",t.checked);});
document.addEventListener("input",e=>{if(e.target.id==="pq"&&S.sheet&&S.sheet.type==="pick"){S.sheet.q=e.target.value;const tmp=document.createElement("div");const ls0=lastSheet;tmp.innerHTML=sheetHTML();lastSheet=ls0;const n=tmp.querySelector("#plist"),o=document.getElementById("plist");if(n&&o)o.replaceWith(n);return;}
  if(e.target.id==="q"){S.q=e.target.value;const tmp=document.createElement("div");tmp.innerHTML=vRezepte();const n=tmp.querySelector("#rlist"),o=document.getElementById("rlist");if(n&&o)o.replaceWith(n);}});
document.addEventListener("submit",async e=>{
  const f=e.target,kind=f.dataset.f;if(!kind)return;e.preventDefault();
  if(kind==="extra"){const n=f.elements.n.value.trim();if(!n)return;const id=now().toString(36);const w=week();w.extra[id]={n:n.slice(0,60),t:now()};saveWeek();render();const i=document.querySelector("form[data-f=extra] input");if(i)i.focus();}
  if(kind==="recipe"){const data=readForm(f);if(!data.n){toast("Bitte einen Namen eingeben");return;}if(!data.z.length){toast("Bitte mindestens eine Zutat eintragen");return;}
    const c=await saveRecipe(data,S.sheet.id);S.sheet={type:"recipe",k:"c:"+c.id};render();toast("Rezept gespeichert");}
  if(kind==="login"){S.ui.busy=true;S.ui.err=null;S.ui.mail=f.elements.mail.value;render();
    try{const m=await FS.signIn(f.elements.mail.value,f.elements.pw.value);S.ui.busy=false;if(!m){S.ui.err="Angemeldet, aber das Konto gehört noch zu keiner Familie.";render();return;}
      /* lokale Bewertungen dem Konto zuordnen */
      S.ratings.forEach(r=>{if(r.member_id==="local"){r.member_id=m.id;r._pending=true;}});
      S.sheet=null;render();toast("Hallo "+m.display_name+"!");syncAll();
    }catch(err){S.ui.busy=false;S.ui.err=err.message;render();}}
});

/* ---------- Start ---------- */
render();
if(online())syncAll();
</script>
